# SL Survival additive overlay for AudioUtil (https://crajjjj.github.io/AudioUtil/).
#
# Registers SLS's stock loose sound pools (shipped by the original SexLab Survival
# under Sound\fx\SL Survival\) as named [sfx] entries so they resolve through
# AudioUtil: SLS scripts play the SLS_* names below via PlaySFX, other mods may do
# the same, and everything is testable from the console (au sfx SLS_Pain).
# [sfx] keys are last-writer-wins across config\*.toml files, so a voice pack or a
# user overlay can retarget any single entry without touching this file. Voice
# packs that just re-record the wavs keep working with no toml at all - same
# folders, higher file priority.
#
# This file is content-only (additive). Engine globals live in the installed BASE
# AudioUtil.toml (SLO VE's or another preset); nothing here overrides them.
# Key/name matching is case- and space-insensitive. Reload in-game: au reload.

# SLS-bundled voice lines, played only via PlayVoiceFromSlot("SLS1", ...) - never resolved
# from an actor (sex "All" keeps it out of the blind default-by-sex fallback). These get
# lipsync like any voice slot; the wavs ship with the original SexLab Survival, so the slot
# always resolves. Used for: scream for help, NPC catcalls, the clothes-strip gasp, and the
# trauma/amputation/barefoot/trip pain grunt.
[[slot]]
id = "SLS1"
sex = "all"
[slot.categories]
Help = 'Sound\fx\SL Survival\Help'
CatCall = 'Sound\fx\SL Survival\Cat Calls'
Gasp = 'Sound\fx\SL Survival\FemaleGasp'
Pain = 'Sound\fx\SL Survival\Pain'

[sfx]
# Foley SLS plays through AudioUtil via PlaySFX, all in the sls_sfx bucket (fallback: legacy
# Sound forms). Swallow sounds are here, not treated as voice: the mouth is busy swallowing,
# so there is no phoneme to lipsync. Voice packs can still re-record any pool by folder.
SLS_CumSwallow = 'Sound\fx\SL Survival\CumSwallow'                     # per-gulp swallow
SLS_CumSwallowForced = 'Sound\fx\SL Survival\CumSwallowForced'         # forced-swallow reaction (scene victim)
SLS_CumSwallowSatisfied = 'Sound\fx\SL Survival\CumSwallowSatisfied'   # willing/greedy swallow reaction
SLS_TraumaHits = 'Sound\fx\SL Survival\TraumaHits'                     # slap/hit impacts
SLS_CumFill = 'Sound\fx\SL Survival\CumFill'                           # cum-fill squelch (inside loads)

# Masochist slap moan: the mouth IS free, so SLS plays it through PlayVoice "NearOrgasmNoises"
# (voice-pack category, lipsynced) - NOT this name. Folder kept for console tests / voice-pack
# override; it is the no-pack fallback (legacy Sound form).
SLS_SlapMoans = 'Sound\fx\SL Survival\Slapping\Moans'                  # masochist moan on a trauma slap (shipped by voice packs, not stock)

# Daydream head-voices: inner monologue, deliberately played as SFX (no lipsync - the
# voices are in her head, the mouth stays still), in the sls_voice volume bucket.
SLS_DaydreamAction = 'Sound\fx\SL Survival\Voices\Action'              # cum-addict daydream head-voices
SLS_DaydreamTaunt = 'Sound\fx\SL Survival\Voices\Taunt'

# Stock pools registered for completeness - played via legacy Sound forms today,
# resolvable by name for console tests, voice packs and other consumer mods.
SLS_Pain = 'Sound\fx\SL Survival\Pain'                                 # pain squeaks (the _SLS_PainSM pool)
SLS_AssSlapMoan = 'Sound\fx\SL Survival\AssSlapMoan'                   # walk-by ass-slap grunts
SLS_FemaleGasp = 'Sound\fx\SL Survival\FemaleGasp'
SLS_Breathing = 'Sound\fx\SL Survival\Breathing'
SLS_CatCalls = 'Sound\fx\SL Survival\Cat Calls'
SLS_Help = 'Sound\fx\SL Survival\Help'
SLS_Curse = 'Sound\fx\SL Survival\Curse'
SLS_Dance = 'Sound\fx\SL Survival\Dance'
SLS_Horse = 'Sound\fx\SL Survival\Horse'
SLS_Amputation = 'Sound\fx\SL Survival\Amputation'
SLS_ArmorEquip = 'Sound\fx\SL Survival\ArmorEquip'
SLS_BarefootPainFemale = 'Sound\fx\SL Survival\BarefootRealism\FemalePain'
SLS_BarefootPainMale = 'Sound\fx\SL Survival\BarefootRealism\MalePain'
SLS_AutoSuck = 'Sound\fx\SL Survival\Voices\Autosuck'

# No [groups] volumes here on purpose: set the sls_voice / sls_sfx volumes from the SLS
# MCM (Trauma page, General), not this file. A value written here is overridden on load
# anyway, so change the volume in-game instead.

[gag]
# SLS's own mouth-occupier marker, so a base config with [gag] enabled muffles a
# deepthroating/tongue-out PC even if its own list misses it (additive; a marker
# whose mod isn't installed is skipped, and duplicates are harmless).
keywords = [
  'SL Survival.esp|0B74B5',   # _SLS_TongueKeyword
]
