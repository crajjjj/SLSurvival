;------------------------------------------------------------------------------------------------
;  SL Survival - _SLS_BikiniArmor distribution (KID)
;------------------------------------------------------------------------------------------------
; Distributes SL Survival's _SLS_BikiniArmor [SL Survival.esp] to bikini/revealing armors so the
; Bikini Licence recognises them and the bikini curse / confiscation logic treats them as bikini.
; Selection mirrors the curated Licenses bikini list (SLAB_LicensesBikiniKYWD_KID.ini,
; "OSL Keywords (KID) - Various Armor Patches") - every armor the curator marked as
; BM_LicensesBikiniItem [0x32~Licenses.esp] gets _SLS_BikiniArmor here.
; Ignore-marker lines (0x962 BM_LicensesIgnoreItem: earrings, veils, wigs, capes) are NOT mirrored -
; SLS has no ignore keyword and skips most such pieces by weight class anyway.
; Heels/piercing lines filtered by SLA_* keywords are NOT mirrored (those keywords are themselves
; KID-distributed; matching on them depends on ini processing order and can silently no-op).
; NOTE: filename starts with 'zzz' so exclusion filters like -SLA_ArmorPretty are processed after
; the OSL keyword inis have (probably) run. Generated 2026-07-17 from the SLAB file.


; === SELECTION I === ; (Nexus)
